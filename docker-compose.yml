services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: income_gap
      POSTGRES_USER: income_gap
      POSTGRES_PASSWORD: income_gap
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U income_gap -d income_gap"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://income_gap:income_gap@db:5432/income_gap}
      SECRET_KEY: ${SECRET_KEY:-development-only-change-me-with-at-least-32-bytes}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
